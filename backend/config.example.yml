classlive:
  server:
    host: "0.0.0.0"
    port: 8080
    # Build du frontend (Vite/React) servi sur /app par le backend lui-même.
    # Chemin absolu, ou relatif au workdir. null = désactivé (API seule).
    frontend_dir: null
  storage:
    workdir: "~/classlive_workspace"
    events_dir: "Evts"
  logging:
    level: "INFO"
  security:
    trainer_username: "formateur"
    # Mot de passe dans CLASSLIVE_TRAINER_PASSWORD (fichier systemd .env)
    # Option de compatibilité : X-API-Key donne les droits formateur si renseigné.
    api_key: null
    # Origines autorisées en CORS pour un frontend séparé (Vite/React).
    # "*" = tout le LAN (HTTP non chiffré, réservé au réseau de confiance).
    cors_origins: ["*"]
    # Comptes formateurs supplémentaires (en plus de CLASSLIVE_TRAINER_PASSWORD).
    trainer_accounts:
      - { username: "prof2", password: "mot-de-passe-min-8-car" }
  session:
    # Nombre max d'élèves par session (0 = illimité).
    max_students: 300
    # Rétention des sessions terminées en jours (0 = jamais de purge auto).
    retention_days: 365
    # Tentatives de join max par minute et par IP (anti brute-force du code à 6 chiffres).
    join_rate_limit: 300
  audit:
    enabled: true
    # Fichier journal d'audit (défaut: <workdir>/audit.log).
    file: null
  export:
    # Taille max d'un export ZIP d'événement, en Mo.
    max_zip_mb: 50
  media:
    # Taille max d'un média uploadé par événement (png, jpg, gif, svg, webp, pdf), en Mo.
    max_file_mb: 10
