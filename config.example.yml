classlive:
  server:
    host: "0.0.0.0"
    port: 8080
  storage:
    workdir: "~/classlive_workspace"
    events_dir: "Evts"
  logging:
    level: "INFO"
  security:
    trainer_username: "formateur"
    # Mot de passe dans CLASSLIVE_TRAINER_PASSWORD (fichier systemd .env)
    # Option de compatibilité : X-API-Key donne les droits formateur si renseigné.
    api_key: null
    # Origines autorisées en CORS pour un frontend séparé (Vite/React).
    # "*" = tout le LAN (HTTP non chiffré, réservé au réseau de confiance).
    cors_origins: ["*"]
