[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "classlive-backend"
version = "0.8.4"
description = "API de gestion des groupes et événements ClassLive"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn>=0.30,<1.0",
  "PyYAML>=6.0,<7.0",
  "websockets>=13,<17",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1.0"]

[project.scripts]
classlive = "classlive.__main__:main"

[tool.setuptools.packages.find]
include = ["classlive*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
classlive = ["GUIDE_CLASSLIVE.md"]
